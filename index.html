<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake deTour</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="console">
    <div id="hud">
        <span id="score">0003</span>
        <span id="highScore">HI 0003</span>
    </div>

    <div id="screen">
        <div id="game"></div>

        <div id="overlay">
            <h1>SNAKE</h1>
            <p id="overlayText">HIGH SCORE: 3</p>
            <button id="startButton">START GAME</button>
        </div>
    </div>
    <div id="controls">
    <button data-dir="w">▲</button>

    <div>
        <button data-dir="a">◀</button>
        <button data-dir="s">▼</button>
        <button data-dir="d">▶</button>
    </div>
</div>
</div>
    <script src="main.js"></script>
</body>
</html>
